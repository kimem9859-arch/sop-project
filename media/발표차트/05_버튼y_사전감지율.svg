<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0.0" y="0.0" width="1600.0" height="900.0" fill="#ffffff" rx="0" opacity="1.0"/><text x="70" y="78" font-family="NanumGothic, 나눔고딕, sans-serif" font-size="40" fill="#1a1a1a" text-anchor="start" font-weight="bold">감지 성능을 가르는 변수는 자세가 아니라 버튼의 화면 속 높이</text><text x="70" y="116" font-family="NanumGothic, 나눔고딕, sans-serif" font-size="20" fill="#6b7280" text-anchor="start" font-weight="normal">사전 감지율 = (감지 성공 눌림 ÷ 전체 눌림). 프레임 단위 손 검출률이 아니다.</text><rect x="355.0" y="210.0" width="450.0" height="430.0" fill="#059669" rx="6" opacity="0.08"/><text x="580.0" y="196" font-family="NanumGothic, 나눔고딕, sans-serif" font-size="21" fill="#059669" text-anchor="middle" font-weight="bold">권장 운용 구간  y 120~280</text><line x1="130.0" y1="640.0" x2="1480.0" y2="640.0" stroke="#e5e7eb" stroke-width="1"/><text x="114" y="647.0" font-family="NanumGothic, 나눔고딕, sans-serif" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">0%</text><line x1="130.0" y1="540.0" x2="1480.0" y2="540.0" stroke="#e5e7eb" stroke-width="1"/><text x="114" y="547.0" font-family="NanumGothic, 나눔고딕, sans-serif" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">25%</text><line x1="130.0" y1="440.0" x2="1480.0" y2="440.0" stroke="#e5e7eb" stroke-width="1"/><text x="114" y="447.0" font-family="NanumGothic, 나눔고딕, sans-serif" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">50%</text><line x1="130.0" y1="340.0" x2="1480.0" y2="340.0" stroke="#e5e7eb" stroke-width="1"/><text x="114" y="347.0" font-family="NanumGothic, 나눔고딕, sans-serif" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">75%</text><line x1="130.0" y1="240.0" x2="1480.0" y2="240.0" stroke="#e5e7eb" stroke-width="1"/><text x="114" y="247.0" font-family="NanumGothic, 나눔고딕, sans-serif" font-size="16" fill="#6b7280" text-anchor="end" font-weight="normal">100%</text><rect x="148.0" y="282.6" width="189