if" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="normal">세로축 = 사전 감지율(눌림 1건 단위, 창 5프레임) · 표본 503건 · 22세션 통합 · 팜 임계 0.5 고정</text></svg>